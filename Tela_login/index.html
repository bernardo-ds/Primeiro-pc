<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="flex quadrado-1 redonda center">
            
            <h2 class="text">Login</h2>

            <form id="formLogin">
                <input class="inp" type="email" id="email" placeholder="E-mail">
                <input class="inp" type="password" id="senha" placeholder="Senha">
                <button class="bot" type="submit">Entrar</button>
            </form>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
